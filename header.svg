<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="240" viewBox="0 0 1200 240">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7F5AF0"/>
      <stop offset="100%" stop-color="#2CB67D"/>
    </linearGradient>
    <style>
      .title { font: 800 64px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #fff; }
      .sub { font: 600 22px 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; fill: #fff; opacity: .92; letter-spacing: 1px; }
      .fade { animation: fade 1.2s ease-out both; }
      .d2 { animation-delay: .4s; }
      .wave { animation: wave 8s ease-in-out infinite alternate; }
      @keyframes fade { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes wave { from { transform: translateX(0); } to { transform: translateX(-60px); } }
    </style>
  </defs>
  <rect width="1200" height="240" fill="url(#g)"/>
  <path class="wave" d="M0 200 C 200 160, 400 240, 600 200 S 1000 160, 1260 200 L 1260 240 L 0 240 Z" fill="#0D1117" opacity=".35"/>
  <path d="M0 215 C 250 185, 450 245, 700 215 S 1050 190, 1200 215 L 1200 240 L 0 240 Z" fill="#0D1117"/>
  <text class="title fade" x="600" y="105" text-anchor="middle">Juan Herrera</text>
  <text class="sub fade d2" x="600" y="148" text-anchor="middle">Full Stack Developer • Automation &amp; AI Engineer</text>
</svg>
